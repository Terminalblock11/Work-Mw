name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "Using SDK at $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install JS dependencies
        run: npm ci

      - name: Sync web app into the Android project
        run: npx cap sync android

      - name: Download Gradle (long timeout, with retries)
        working-directory: android
        run: |
          chmod +x gradlew
          sed -i 's/^networkTimeout=.*/networkTimeout=180000/; s/-all\.zip/-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4 5; do
            ./gradlew --version && break
            echo "Gradle download failed (attempt $i), retrying in 20s..."
            sleep 20
          done
          ./gradlew --version

      - name: Prepare release keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets set - using the repo's stable key."
          fi

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build AAB for Play Store (only with release keystore)
        if: env.KEYSTORE_FILE != ''
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Name the files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/WorkMw-Generator-v${APP_VERSION_NAME}.apk"
          if [ -d android/app/build/outputs/bundle/release ]; then
            cp android/app/build/outputs/bundle/release/*.aab "dist/WorkMw-Generator-v${APP_VERSION_NAME}.aab"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorkMw-Generator-APK
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: WorkMw Generator v${{ env.APP_VERSION_NAME }}
          files: dist/*
